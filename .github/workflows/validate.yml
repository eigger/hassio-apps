---
name: Validate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pins:
    name: Image pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every app pins one tag per image, and its version tracks upstream
        run: python3 .github/scripts/pins.py check

  addon:
    name: Add-on config (${{ matrix.addon }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: [esphome_ota, garage]
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./${{ matrix.addon }}
