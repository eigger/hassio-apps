---
name: Validate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # The app list comes from the folders themselves, so adding or removing an app
  # needs no edit here.
  discover:
    name: Find apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: python3 .github/scripts/pins.py list

  pins:
    name: Image pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every app pins one tag per image, and its version tracks upstream
        run: python3 .github/scripts/pins.py check

  addon:
    name: Add-on config (${{ matrix.addon }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./${{ matrix.addon }}
