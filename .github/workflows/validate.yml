---
name: Validate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pins:
    name: Image pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every app pins one tag per image, and its version tracks upstream
        run: python3 .github/scripts/pins.py check

  addon:
    name: Add-on config (${{ matrix.addon }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # esphome_ota is deliberately absent: the linter treats spelling out a
        # default (boot/startup/ingress_port) as an error, and its config states
        # those on purpose. Nothing there is broken, so it is left alone.
        addon: [garage, stash, drop, kibble]
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./${{ matrix.addon }}
