<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESPHome OTA Publisher</title>
<style>
  :root {
    --bg: #f6f7f9; --fg: #16191d; --muted: #6b7480; --card: #fff;
    --line: #e2e5ea; --accent: #03a9f4; --ok: #2e7d32; --warn: #b26a00; --err: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --fg:#e6e8eb; --muted:#98a1ac; --card:#1b1f24;
            --line:#2b3138; --accent:#4fc3f7; --ok:#81c784; --warn:#ffb74d; --err:#ef9a9a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--fg);
         font:14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); margin-bottom:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:14px 16px; margin-bottom:14px; }
  .banner { border-left:4px solid var(--warn); }
  .banner.err { border-left-color:var(--err); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line);
           vertical-align:middle; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase;
       letter-spacing:.04em; }
  td.name { font-weight:600; }
  /* Keep secondary lines in-flow with a fixed line-height so every data cell
     shares the same row height — a bare <div> under the name/version used to
     make left columns taller than the actions cell and the shared border
     looked stepped across the row. */
  td .subline { display:block; margin-top:2px; line-height:1.3; min-height:1.3em; }
  .chip { display:inline-block; padding:1px 7px; border-radius:99px; font-size:12px;
          border:1px solid var(--line); color:var(--muted); vertical-align:middle; }
  .chip.ok { color:var(--ok); border-color:currentColor; }
  .chip.warn { color:var(--warn); border-color:currentColor; }
  button { font:inherit; padding:5px 11px; border-radius:6px; border:1px solid var(--line);
           background:transparent; color:var(--fg); cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#04121a; }
  /* Never put display:flex on a <td> — it drops table-cell layout and the
     row's bottom border stops lining up across columns. */
  .actions { display:flex; gap:6px; flex-wrap:wrap; align-items:center;
             justify-content:flex-end; }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:6px;
        padding:10px; overflow-x:auto; font-size:12.5px; margin:8px 0 0; }
  .snippetLabel { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .copyBtn { display:inline-flex; align-items:center; gap:5px; padding:3px 8px; }
  .copyBtn svg { display:block; }
  .log { max-height:260px; overflow-y:auto; white-space:pre-wrap; }
  .muted { color:var(--muted); }
  .tiny { font-size:12px; }
  code { background:var(--bg); padding:1px 5px; border-radius:4px; }
  select, input[type=text], input[type=file] {
    font:inherit; padding:5px 8px; border-radius:6px; border:1px solid var(--line);
    background:var(--card); color:var(--fg);
  }
  .topbar { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .formgrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
              gap:10px; align-items:end; margin-top:10px; }
  .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:3px; }
  .field input, .field select { width:100%; }
  details summary { cursor:pointer; font-weight:600; }
  details[open] summary { margin-bottom:4px; }
</style>
</head>
<body>
<div class="topbar">
  <div>
    <h1 id="t-title">ESPHome OTA Publisher</h1>
    <div class="sub" id="t-sub">Pulls firmware from the ESPHome dashboard and publishes it to /local.</div>
  </div>
  <select id="langSelect" title="Language">
    <option value="auto">Auto</option>
    <option value="en">English</option>
    <option value="ko">한국어</option>
  </select>
</div>

<div id="banners"></div>
<div id="deviceBanner"></div>

<div class="card">
  <table>
    <thead>
      <tr>
        <th id="t-col-device">Device</th>
        <th id="t-col-chip">Chip</th>
        <th id="t-col-version">Published version</th>
        <th id="t-col-status">Status</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="rows"><tr><td colspan="5" class="muted" id="t-loading">Loading…</td></tr></tbody>
  </table>
</div>

<div class="card" id="detail" hidden></div>

<details class="card">
  <summary id="t-manual-title">Manual publish</summary>
  <div class="tiny muted" id="t-manual-body">
    Publish a firmware.ota.bin you downloaded from the ESPHome dashboard yourself.
  </div>
  <form id="manualForm" class="formgrid">
    <div class="field">
      <label id="t-manual-node" for="mNode">Node name</label>
      <input type="text" id="mNode" name="node" pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,62}" required>
    </div>
    <div class="field">
      <label id="t-manual-chip" for="mChip">Chip family</label>
      <select id="mChip" name="chip_family"></select>
    </div>
    <div class="field">
      <label id="t-manual-version" for="mVersion">Version</label>
      <input type="text" id="mVersion" name="version" required>
    </div>
    <div class="field">
      <label id="t-manual-titlefield" for="mTitle">Title</label>
      <input type="text" id="mTitle" name="title">
    </div>
    <div class="field">
      <label id="t-manual-file" for="mFile">firmware.ota.bin</label>
      <input type="file" id="mFile" name="file" accept=".bin" required>
    </div>
    <div class="field">
      <button type="submit" class="primary jobctl" id="manualSubmit">Publish</button>
    </div>
  </form>
  <div id="manualResult" class="tiny" style="margin-top:8px"></div>
</details>

    reuploadTitle: '이 기기의 게시된 firmware.ota.bin을 새 파일로 교체합니다',

function detectLocale() {
  const saved = localStorage.getItem('esphome_ota_lang');
  if (saved === 'en' || saved === 'ko') return saved;
  return (navigator.language || 'en').toLowerCase().startsWith('ko') ? 'ko' : 'en';
}

let LOCALE = detectLocale();
let T = STRINGS[LOCALE];

const $ = (id) => document.getElementById(id);
let status = {};
let polling = null;
let jobRunning = false;

function applyStaticText() {
  document.documentElement.lang = LOCALE;
  $('t-title').textContent = T.title;
  $('t-sub').textContent = T.sub;
  $('t-col-device').textContent = T.colDevice;
  $('t-col-chip').textContent = T.colChip;
  $('t-col-version').textContent = T.colVersion;
  $('t-col-status').textContent = T.colStatus;
  $('t-loading').textContent = T.loading;
  $('t-manual-title').textContent = T.manualTitle;
  $('t-manual-body').innerHTML = T.manualBody;
  $('t-manual-node').textContent = T.manualNode;
  $('t-manual-chip').textContent = T.manualChip;
  $('t-manual-version').textContent = T.manualVersion;
  $('t-manual-titlefield').textContent = T.manualTitleField;
  $('t-manual-file').textContent = T.manualFile;
  $('manualSubmit').textContent = T.manualSubmit;
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}

function banner(title, body, kind) {
  const div = document.createElement('div');
  div.className = 'card banner' + (kind === 'err' ? ' err' : '');
  div.innerHTML = `<b>${title}</b><br><span class="muted tiny">${body}</span>`;
  $('banners').appendChild(div);
}

async function loadStatus() {
  status = await api('api/status');
  $('banners').innerHTML = '';
  if (status.restart_required) banner(T.restartTitle, T.restartBody, 'warn');
  if (!status.dashboard) banner(T.noDashboardTitle, T.noDashboardBody, 'err');
  if (!status.base_url) banner(T.noBaseUrlTitle, T.noBaseUrlBody, 'err');
  else if (status.base_url_source === 'lan_ip_fallback') banner(T.lanFallbackTitle, T.lanFallbackBody, 'warn');

  const chipSelect = $('mChip');
  const previous = chipSelect.value;
  // Empty value = let the server read chipFamily out of the uploaded image.
  // Picking one by hand is only needed for targets whose header carries no
  // chip_id (ESP8266/RP2040).
  chipSelect.innerHTML = `<option value="">${T.manualChipAuto}</option>` +
    (status.chip_families || [])
      .map((c) => `<option value="${c}">${c}</option>`).join('');
  chipSelect.value = previous;
}

function row(d) {
  const tr = document.createElement('tr');
  const pub = d.published;
  const stale = pub && d.project_version && pub.version !== d.project_version;

  // Kept to one line always (as a title tooltip, not a second <div>) so this
  // column's height doesn't vary row to row and throw off the row's shared
  // bottom border against columns that are consistently one line.
  const noVersionHint = d.project_version ? '' : ` title="${T.noProjectVersion}"`;
  const state = !pub
    ? `<span class="chip"${noVersionHint}>${T.notPublished}</span>`
    : stale
      ? `<span class="chip warn"${noVersionHint}>${T.needsRepublish}</span>`
      : `<span class="chip ok"${noVersionHint}>${T.published}</span>`;

  // Always emit a .subline under version so the cell's height matches rows
  // that have an md5 (and name cells that have a configuration subtitle).
  const version = pub
    ? `${escapeHtml(pub.version)}<span class="subline tiny muted">` +
      `${T.publishedMeta(pub.md5.slice(0, 8), formatPublishedAt(pub.published_at))}</span>`
    : `<span class="muted">—</span><span class="subline tiny muted">&nbsp;</span>`;

  const badge = d.manual
    ? ` <span class="chip" title="${T.manualBadgeTitle}">${T.manualBadge}</span>`
    : '';
  const subtitle = d.configuration
    ? `<span class="subline tiny muted">${escapeHtml(d.configuration)}</span>`
    : `<span class="subline tiny muted">&nbsp;</span>`;

  tr.innerHTML = `
    <td class="name">${escapeHtml(d.friendly_name)}${badge}${subtitle}</td>
    <td>${d.chip_family ? escapeHtml(d.chip_family) : '<span class="muted">?</span>'}</td>
    <td>${version}</td>
    <td>${state}</td>
    <td><div class="actions"></div></td>`;

  const actions = tr.querySelector('.actions');

  if (d.manual) {
    // No dashboard configuration to build from — this row exists purely
    // because a manifest is on disk for it. Re-upload replaces the bin via
    // the same POST /api/publish/manual path as the form below.
    const uploadBtn = document.createElement('button');
    uploadBtn.className = 'jobctl primary';
    uploadBtn.textContent = T.reupload;
    uploadBtn.title = T.reuploadTitle;
    uploadBtn.disabled = jobRunning;
    uploadBtn.onclick = () => openReupload(d);

    const yamlBtn = document.createElement('button');
    yamlBtn.textContent = T.yaml;
    yamlBtn.onclick = () => showSnippet(d);
    actions.append(uploadBtn, yamlBtn);
  } else {
    const publishBtn = document.createElement('button');
    publishBtn.className = 'jobctl';
    publishBtn.textContent = T.publish;
    publishBtn.disabled = jobRunning || !d.has_binary;
    publishBtn.title = d.has_binary ? T.publishTitleReady : T.publishTitleMissing;
    publishBtn.onclick = () => run(d, false, publishBtn);

    const buildBtn = document.createElement('button');
    buildBtn.className = 'jobctl primary';
    buildBtn.textContent = T.buildPublish;
    buildBtn.disabled = jobRunning;
    buildBtn.onclick = () => run(d, true, buildBtn);

    const yamlBtn = document.createElement('button');
    yamlBtn.textContent = T.yaml;
    yamlBtn.onclick = () => showSnippet(d);

    actions.append(publishBtn, buildBtn, yamlBtn);
  }

  if (pub) {
    const deleteBtn = document.createElement('button');
    deleteBtn.textContent = T.deleteBtn;
    deleteBtn.onclick = () => deletePublished(d);
    actions.append(deleteBtn);
  }

  return tr;
}

function openReupload(d) {
  const pub = d.published || {};
  const form = $('manualForm');
  const panel = form.closest('details');
  if (panel) panel.open = true;

  $('mNode').value = d.node || '';
  if (d.chip_family) $('mChip').value = d.chip_family;
  else if (pub.chip_family) $('mChip').value = pub.chip_family;
  $('mVersion').value = pub.version || '';
  $('mTitle').value = pub.title || d.friendly_name || '';
  $('mFile').value = '';

  const result = $('manualResult');
  result.innerHTML = `<span class="muted">${escapeHtml(T.reuploadHint(d.friendly_name || d.node))}</span>`;

  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  $('mFile').focus();
}

async function deletePublished(d) {
  if (!confirm(T.deleteConfirm(d.friendly_name))) return;
  await api(`api/publish/${encodeURIComponent(d.node)}`, { method: 'DELETE' });
  loadDevices();
}

async function loadDevices() {
  try {
    const { devices, dashboard_error } = await api('api/devices');
    // A dedicated slot, not the generic banner() accumulator: loadDevices()
    // re-runs after every job/publish/delete, and banner() only ever
    // appends — reusing it here would stack a fresh copy on every refresh.
    $('deviceBanner').innerHTML = dashboard_error
      ? `<div class="card banner warn"><b>${T.dashboardErrorTitle}</b><br>` +
        `<span class="muted tiny">${T.dashboardErrorBody(escapeHtml(dashboard_error))}</span></div>`
      : '';
    const tbody = $('rows');
    tbody.innerHTML = '';
    if (!devices.length) {
      tbody.innerHTML = `<tr><td colspan="5" class="muted">${T.noDevices}</td></tr>`;
      return;
    }
    devices.forEach((d) => tbody.appendChild(row(d)));
  } catch (err) {
    $('rows').innerHTML = `<tr><td colspan="5" class="muted">${escapeHtml(err.message)}</td></tr>`;
  }
}

const COPY_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
  '<rect x="9" y="9" width="13" height="13" rx="2"></rect>' +
  '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
const CHECK_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' +
  '<polyline points="20 6 9 17 4 12"></polyline></svg>';

async function copySnippet(id, btn) {
  const text = $(id).textContent;
  let ok = true;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      throw new Error('no async clipboard');
    }
  } catch {
    // Ingress is often plain http on the LAN, which isn't a "secure context" —
    // navigator.clipboard is unavailable there, so fall back to the old
    // select+execCommand trick instead of just failing silently.
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand('copy'); } catch { ok = false; }
    document.body.removeChild(ta);
  }
  const original = btn.innerHTML;
  btn.innerHTML = ok ? `${CHECK_ICON}<span>${T.copied}</span>` : original;
  btn.disabled = true;
  setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 1400);
}
window.copySnippet = copySnippet;

async function showSnippet(d) {
  const { snippet, legacy } = await api(`api/snippet?node=${encodeURIComponent(d.node)}`);
  const detail = $('detail');
  detail.hidden = false;
  detail.innerHTML = `
    <b>${T.yamlHeader(d.friendly_name)}</b>
    <div class="snippetLabel tiny muted" style="margin-top:10px">
      <span>${T.yamlNote}</span>
      <button type="button" class="copyBtn" title="${T.copyTitle}"
              onclick="copySnippet('snippetA', this)">${COPY_ICON}</button>
    </div>
    <pre id="snippetA">${escapeHtml(snippet)}</pre>
    <details style="margin-top:14px">
      <summary class="tiny">${T.legacyTitle}</summary>
      <div class="tiny muted" style="margin-top:6px">${T.legacyBody}</div>
      <div class="snippetLabel tiny muted" style="margin-top:10px">
        <span>${T.legacyUpdateLabel}</span>
        <button type="button" class="copyBtn" title="${T.copyTitle}"
                onclick="copySnippet('snippetLegacyUpdate', this)">${COPY_ICON}</button>
      </div>
      <pre id="snippetLegacyUpdate">${escapeHtml(legacy.update)}</pre>
      <div class="snippetLabel tiny muted" style="margin-top:10px">
        <span>${T.legacyButtonLabel}</span>
        <button type="button" class="copyBtn" title="${T.copyTitle}"
                onclick="copySnippet('snippetLegacyButton', this)">${COPY_ICON}</button>
      </div>
      <pre id="snippetLegacyButton">${escapeHtml(legacy.button)}</pre>
    </details>`;
  detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

function formatPublishedAt(iso) {
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return iso;
  return date.toLocaleString(LOCALE === 'ko' ? 'ko-KR' : 'en-US', {
    dateStyle: 'short', timeStyle: 'short',
  });
}

function setJobButtonsDisabled(disabled) {
  document.querySelectorAll('.jobctl').forEach((b) => { b.disabled = disabled; });
}

async function run(d, compile, clickedBtn) {
  if (jobRunning) return;
  jobRunning = true;
  // Disabled synchronously, before anything async — the click must visibly
  // register even if the POST below takes a moment (queued behind another
  // build, or a slow dashboard connection).
  setJobButtonsDisabled(true);
  const originalLabel = clickedBtn ? clickedBtn.textContent : '';
  if (clickedBtn) clickedBtn.textContent = compile ? T.building : T.publishing;

  const detail = $('detail');
  detail.hidden = false;
  detail.innerHTML = `<b>${d.friendly_name}</b> — ${compile ? T.building : T.publishing}<pre class="log" id="joblog"></pre>`;

  try {
    const job = await api('api/publish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ configuration: d.configuration, compile }),
    });
    clearInterval(polling);
    polling = setInterval(() => pollJob(job.id), 1500);
  } catch (err) {
    jobRunning = false;
    if (clickedBtn) clickedBtn.textContent = originalLabel;
    detail.innerHTML += `\n<div class="tiny" style="color:var(--err)">${escapeHtml(err.message)}</div>`;
    loadDevices();
  }
}

async function pollJob(id) {
  const job = await api(`api/jobs/${id}`);
  const log = $('joblog');
  if (log) {
    const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
    log.textContent = job.lines.join('\n') + (job.error ? `\n\n${job.error}` : '');
    if (atBottom) log.scrollTop = log.scrollHeight;
  }
  if (job.status !== 'running') {
    clearInterval(polling);
    polling = null;
    jobRunning = false;
    loadDevices();
  }
}

$('manualForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (jobRunning) return;
  jobRunning = true;
  setJobButtonsDisabled(true);
  const submitBtn = $('manualSubmit');
  const originalLabel = submitBtn.textContent;
  submitBtn.textContent = T.manualUploading;
  const result = $('manualResult');
  result.textContent = '';

  try {
    const form = new FormData(e.target);
    const body = await api('api/publish/manual', { method: 'POST', body: form });
    result.innerHTML = `<span style="color:var(--ok)">${T.manualOk(body.node)}</span>`;
    e.target.reset();
  } catch (err) {
    result.innerHTML = `<span style="color:var(--err)">${escapeHtml(err.message)}</span>`;
  } finally {
    jobRunning = false;
    submitBtn.textContent = originalLabel;
    submitBtn.disabled = false;
    // Table buttons' disabled state depends on per-device data (has_binary),
    // not just jobRunning — a blind re-enable here would un-disable a
    // Publish button for a device with no built binary. Reload instead.
    loadDevices();
  }
});

$('langSelect').value = localStorage.getItem('esphome_ota_lang') || 'auto';
$('langSelect').addEventListener('change', (e) => {
  const value = e.target.value;
  if (value === 'auto') localStorage.removeItem('esphome_ota_lang');
  else localStorage.setItem('esphome_ota_lang', value);
  LOCALE = detectLocale();
  T = STRINGS[LOCALE];
  applyStaticText();
  loadStatus();
  loadDevices();
});

(async () => {
  applyStaticText();
  await loadStatus();
  await loadDevices();
})();
</script>
</body>
