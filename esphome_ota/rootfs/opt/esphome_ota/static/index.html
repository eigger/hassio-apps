<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESPHome OTA Publisher</title>
<style>
  :root {
    --bg: #f6f7f9; --fg: #16191d; --muted: #6b7480; --card: #fff;
    --line: #e2e5ea; --accent: #03a9f4; --ok: #2e7d32; --warn: #b26a00; --err: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --fg:#e6e8eb; --muted:#98a1ac; --card:#1b1f24;
            --line:#2b3138; --accent:#4fc3f7; --ok:#81c784; --warn:#ffb74d; --err:#ef9a9a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--fg);
         font:14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); margin-bottom:18px; }
  #t-addon-ver { font-weight:400; margin-left:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:14px 16px; margin-bottom:14px; }
  .banner { border-left:4px solid var(--warn); }
  .banner.err { border-left-color:var(--err); }
  .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table { width:100%; border-collapse:collapse; min-width: 0; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line);
           vertical-align:middle; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase;
       letter-spacing:.04em; }
  td.name { font-weight:600; word-break:break-word; overflow-wrap:anywhere; }
  /* Keep secondary lines in-flow with a fixed line-height so every data cell
     shares the same row height — a bare <div> under the name/version used to
     make left columns taller than the actions cell and the shared border
     looked stepped across the row. */
  td .subline { display:block; margin-top:2px; line-height:1.3; min-height:1.3em; }
  td.next-cell input { width: 100%; max-width: 7.5em; vertical-align: middle; }
  .chip { display:inline-block; padding:1px 7px; border-radius:99px; font-size:12px;
          border:1px solid var(--line); color:var(--muted); vertical-align:middle;
          white-space:nowrap; }
  .chip.ok { color:var(--ok); border-color:currentColor; }
  .chip.warn { color:var(--warn); border-color:currentColor; }
  button { font:inherit; padding:5px 11px; border-radius:6px; border:1px solid var(--line);
           background:transparent; color:var(--fg); cursor:pointer; white-space:nowrap; }
  button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#04121a; }
  /* Never put display:flex on a <td> — it drops table-cell layout and the
     row's bottom border stops lining up across columns. */
  .actions { display:flex; gap:6px; flex-wrap:wrap; align-items:center;
             justify-content:flex-end; }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:6px;
        padding:10px; overflow-x:auto; font-size:12.5px; margin:8px 0 0; }
  .snippetLabel { display:flex; align-items:center; justify-content:space-between; gap:8px;
                  flex-wrap:wrap; }
  .copyBtn { display:inline-flex; align-items:center; gap:5px; padding:3px 8px; }
  .copyBtn svg { display:block; }
  .log { max-height:260px; overflow-y:auto; white-space:pre-wrap; }
  .muted { color:var(--muted); }
  .tiny { font-size:12px; }
  code { background:var(--bg); padding:1px 5px; border-radius:4px; }
  select, input[type=text], input[type=file] {
    font:inherit; padding:5px 8px; border-radius:6px; border:1px solid var(--line);
    background:var(--card); color:var(--fg); max-width:100%;
  }
  .topbar { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  #langSelect { flex:0 0 auto; }
  .formgrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
              gap:10px; align-items:end; margin-top:10px; }
  .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:3px; }
  .field input, .field select { width:100%; }
  .field-row { display:flex; gap:8px; align-items:stretch; }
  .field-row select { flex:1; }
  details summary { cursor:pointer; font-weight:600; }
  details[open] summary { margin-bottom:4px; }
  .steps { margin:8px 0 0; padding-left:1.25em; }
  .steps li { margin:3px 0; }
  .howto { margin-top:10px; }
  .howto .steps { margin-top:4px; }
  tr.drop-target td { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  #manualForm.drop-target, details.drop-target { outline: 2px dashed var(--accent); outline-offset: 4px; }
  .toast { color: var(--ok); font-size: 12px; margin-top: 4px; }

  @media (max-width: 720px) {
    body { padding:12px; }
    .card { padding:12px; }
    .topbar { flex-wrap:wrap; align-items:center; }
    .sub { margin-bottom:12px; }
    .formgrid { grid-template-columns:1fr; }
    thead { display:none; }
    .table-wrap { overflow:visible; }
    table, tbody { display:block; width:100%; }
    tbody tr {
      display:grid;
      grid-template-columns:1fr 1fr;
      grid-template-areas:
        "name name"
        "chip status"
        "ver next"
        "actions actions";
      gap:4px 12px;
      border:1px solid var(--line);
      border-radius:10px;
      padding:12px;
      background:var(--card);
      margin-bottom:10px;
    }
    tbody tr:last-child { margin-bottom:0; }
    tbody tr.empty-row {
      display:block;
      border:none;
      padding:8px 0;
      margin:0;
    }
    th, td { border:none; padding:0; }
    td.name {
      grid-area:name;
      font-size:15px;
      padding-bottom:4px;
    }
    td.chip-cell { grid-area:chip; }
    td.status-cell { grid-area:status; }
    td.ver-cell { grid-area:ver; overflow-wrap:anywhere; }
    td.next-cell { grid-area:next; }
    td.next-cell input { max-width: none; }
    td.name .subline, td.ver-cell .subline { min-height:0; }
    td[data-label]::before {
      content: attr(data-label);
      display:block;
      color:var(--muted);
      font-size:11px;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:.04em;
      margin-bottom:2px;
    }
    td.actions-cell {
      grid-area:actions;
      padding-top:8px;
    }
    .actions { justify-content:flex-start; }
    .actions button { flex:1 1 calc(50% - 6px); min-width:0; }
    tbody tr.drop-target {
      outline:2px dashed var(--accent);
      outline-offset:2px;
    }
    tbody tr.drop-target td { background:transparent; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div>
    <h1><span id="t-title">ESPHome OTA Publisher</span> <span id="t-addon-ver" class="tiny muted"></span></h1>
    <div class="sub" id="t-sub">Pulls firmware from the ESPHome dashboard and publishes it to /local.</div>
  </div>
  <select id="langSelect" title="Language">
    <option value="auto">Auto</option>
    <option value="en">English</option>
    <option value="ko">한국어</option>
  </select>
</div>

<div id="banners"></div>
<div id="deviceBanner"></div>

<div class="card">
  <div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th id="t-col-device">Device</th>
        <th id="t-col-chip">Chip</th>
        <th id="t-col-version">Version</th>
        <th id="t-col-next">Next</th>
        <th id="t-col-status">Status</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="rows"><tr class="empty-row"><td colspan="6" class="muted" id="t-loading">Loading…</td></tr></tbody>
  </table>
  </div>
</div>

<div class="card" id="detail" hidden></div>

<details class="card" open>
  <summary id="t-manual-title">Register a device</summary>
  <div class="tiny muted" id="t-manual-body">
    Register a YAML first. Then copy the snippet and publish from the list.
  </div>
  <form id="manualForm" class="formgrid">
    <div class="field">
      <label id="t-manual-node" for="mYaml">Device YAML</label>
      <select id="mYaml"></select>
    </div>
    <div class="field" id="mNodeField" hidden>
      <label id="t-manual-custom" for="mNode">Publish name</label>
      <input type="text" id="mNode" name="node" pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,62}">
    </div>
    <div class="field">
      <label id="t-manual-version" for="mVersion">Version</label>
      <input type="text" id="mVersion" name="version" value="1.0.0" required>
    </div>
    <div class="field">
      <label id="t-manual-titlefield" for="mTitle">Title</label>
      <input type="text" id="mTitle" name="title">
    </div>
    <div class="field">
      <button type="submit" class="primary jobctl" id="manualSubmit">Register</button>
    </div>
  </form>
  <div id="manualResult" class="tiny" style="margin-top:8px"></div>
</details>

function detectLocale() {
  const saved = localStorage.getItem('esphome_ota_lang');
  if (saved === 'en' || saved === 'ko') return saved;
  return (navigator.language || 'en').toLowerCase().startsWith('ko') ? 'ko' : 'en';
}

let LOCALE = detectLocale();
let T = STRINGS[LOCALE];

const $ = (id) => document.getElementById(id);
let status = {};
let polling = null;
let jobRunning = false;
let devicesCache = [];
let configsCache = [];
let versionDirty = false;

function applyStaticText() {
  document.documentElement.lang = LOCALE;
  $('t-title').textContent = T.title;
  $('t-sub').textContent = T.sub;
  $('t-col-device').textContent = T.colDevice;
  $('t-col-chip').textContent = T.colChip;
  $('t-col-version').textContent = T.colVersion;
  $('t-col-next').textContent = T.colNext;
  $('t-col-status').textContent = T.colStatus;
  $('t-loading').textContent = T.loading;
  $('t-manual-title').textContent = T.manualTitle;
  $('t-manual-body').innerHTML = T.manualBody;
  $('t-manual-node').textContent = T.manualNode;
  $('t-manual-custom').textContent = T.manualCustomLabel;
  $('t-manual-version').textContent = T.manualVersion;
  $('mVersion').title = T.manualVersionHint;
  $('t-manual-titlefield').textContent = T.manualTitleField;
  $('manualSubmit').textContent = T.manualSubmit;
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}

function banner(title, body, kind) {
  const div = document.createElement('div');
  div.className = 'card banner' + (kind === 'err' ? ' err' : '');
  div.innerHTML = `<b>${title}</b><br><span class="muted tiny">${body}</span>`;
  $('banners').appendChild(div);
}

async function loadStatus() {
  status = await api('api/status');
  $('banners').innerHTML = '';
  if (status.restart_required) banner(T.restartTitle, T.restartBody, 'warn');
  if (!status.dashboard) banner(T.noDashboardTitle, T.noDashboardBody, 'warn');
  if (!status.base_url) banner(T.noBaseUrlTitle, T.noBaseUrlBody, 'err');
  else if (status.base_url_source === 'lan_ip_fallback') banner(T.lanFallbackTitle, T.lanFallbackBody, 'warn');
  $('t-addon-ver').textContent = status.addon_version || '';
}

function row(d) {
  const tr = document.createElement('tr');
  const pub = d.published;
  const stale = pub && d.own_project_version && pub.version !== d.own_project_version;
  const canDrop = d.publishable !== false;

  const state = !pub
    ? `<span class="chip">${T.notPublished}</span>`
    : stale
      ? `<span class="chip warn">${T.needsRepublish}</span>`
      : `<span class="chip ok">${T.published}</span>`;

  const yamlVer = yamlVersion(d);
  const version = pub
    ? `${escapeHtml(pub.version)}<span class="subline tiny muted">` +
      `${T.publishedMeta(pub.md5.slice(0, 8), formatPublishedAt(pub.published_at))}</span>`
    : `<span class="muted">—</span><span class="subline tiny muted">&nbsp;</span>`;
  const nextId = `nextVersion-${d.node}`;
  const next =
    `<input type="text" id="${escapeHtml(nextId)}" value="${escapeHtml(yamlVer)}" ` +
    `title="${escapeHtml(T.nextCompileVersion)}">`;

  let badge = '';
  if (d.source === 'published' || d.manual) {
    badge = ` <span class="chip" title="${T.manualBadgeTitle}">${T.manualBadge}</span>`;
  }
  const subtitle = d.configuration
    ? `<span class="subline tiny muted">${escapeHtml(d.configuration)}</span>`
    : `<span class="subline tiny muted">&nbsp;</span>`;

  tr.innerHTML = `
    <td class="name">${escapeHtml(d.friendly_name)}${badge}${subtitle}</td>
    <td class="chip-cell" data-label="${escapeHtml(T.colChip)}">${d.chip_family ? escapeHtml(d.chip_family) : '<span class="muted">?</span>'}</td>
    <td class="ver-cell" data-label="${escapeHtml(T.colVersion)}">${version}</td>
    <td class="next-cell" data-label="${escapeHtml(T.colNext)}">${next}</td>
    <td class="status-cell" data-label="${escapeHtml(T.colStatus)}">${state}</td>
    <td class="actions-cell"><div class="actions"></div></td>`;
  if (canDrop) tr.title = T.dropHere;
  bindNextVersionInput(tr.querySelector('.next-cell input'), d);

  const actions = tr.querySelector('.actions');

  const uploadBtn = document.createElement('button');
  uploadBtn.className = d.source === 'dashboard' ? 'jobctl' : 'jobctl primary';
  uploadBtn.textContent = pub ? T.reupload : T.publish;
  uploadBtn.title = T.reuploadTitle;
  uploadBtn.disabled = jobRunning || !canDrop;
  if (!canDrop) uploadBtn.title = T.notPublishable;
  uploadBtn.onclick = (e) => { e.stopPropagation(); pickAndPublish(d); };
  actions.append(uploadBtn);

  if (d.source === 'dashboard') {
    const publishBtn = document.createElement('button');
    publishBtn.className = 'jobctl';
    publishBtn.textContent = T.publish;
    publishBtn.disabled = jobRunning || !d.has_binary;
    publishBtn.title = d.has_binary ? T.publishTitleReady : T.publishTitleMissing;
    publishBtn.onclick = (e) => { e.stopPropagation(); run(d, false, publishBtn); };

    const buildBtn = document.createElement('button');
    buildBtn.className = 'jobctl primary';
    buildBtn.textContent = T.buildPublish;
    buildBtn.disabled = jobRunning;
    buildBtn.onclick = (e) => { e.stopPropagation(); run(d, true, buildBtn); };
    actions.append(publishBtn, buildBtn);
  }

  const yamlBtn = document.createElement('button');
  yamlBtn.textContent = T.yaml;
  yamlBtn.onclick = (e) => {
    e.stopPropagation();
    showSnippet(d);
  };
  actions.append(yamlBtn);

  const deleteBtn = document.createElement('button');
  deleteBtn.textContent = T.deleteBtn;
  deleteBtn.onclick = (e) => { e.stopPropagation(); deletePublished(d); };
  actions.append(deleteBtn);

  if (canDrop) enableDrop(tr, (file) => publishFile(d, file));
  return tr;
}

function enableDrop(el, onFile) {
  el.addEventListener('dragover', (e) => {
    if (![...e.dataTransfer.items].some((i) => i.kind === 'file')) return;
    e.preventDefault();
    el.classList.add('drop-target');
  });
  el.addEventListener('dragleave', (e) => {
    if (!el.contains(e.relatedTarget)) el.classList.remove('drop-target');
  });
  el.addEventListener('drop', (e) => {
    e.preventDefault();
    el.classList.remove('drop-target');
    const file = e.dataTransfer.files[0];
    if (file) onFile(file);
  });
}

function fillNodeSelect(configs) {
  const sel = $('mYaml');
  const prev = sel.value;
  sel.innerHTML = '';
  const placeholder = document.createElement('option');
  placeholder.value = '';
  placeholder.textContent = T.manualPickYaml;
  sel.appendChild(placeholder);
  const registered = new Set(devicesCache.map((d) => d.node));
  (configs || []).filter((d) => d.publishable !== false && d.node && !registered.has(d.node)).forEach((d) => {
    const opt = document.createElement('option');
    opt.value = d.node;
    const file = d.configuration || `${d.node}.yaml`;
    opt.textContent = d.friendly_name && d.friendly_name !== d.node
      ? `${d.friendly_name} (${file})`
      : file;
    sel.appendChild(opt);
  });
  const custom = document.createElement('option');
  custom.value = '__custom__';
  custom.textContent = T.manualCustom;
  sel.appendChild(custom);
  if ([...sel.options].some((o) => o.value === prev)) sel.value = prev;
  syncNodeField();
}

function syncNodeField() {
  const yaml = $('mYaml').value;
  const custom = yaml === '__custom__';
  $('mNodeField').hidden = !custom;
  if (!custom) $('mNode').value = yaml;
}

function yamlVersion(d) {
  return (d && d.project_version) || '1.0.0';
}

function bindNextVersionInput(input, d) {
  if (!input) return;
  input.addEventListener('click', (e) => e.stopPropagation());
  input.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') {
      e.preventDefault();
      input.blur();
    }
  });
  input.addEventListener('change', async () => {
    const next = input.value.trim();
    if (!next || next === yamlVersion(d)) return;
    try {
      await saveWrapperVersion(d, next);
    } catch (err) {
      input.value = yamlVersion(d);
      $('manualResult').innerHTML = `<span style="color:var(--err)">${escapeHtml(err.message)}</span>`;
    }
  });
}

async function saveWrapperVersion(d, next) {
  const saved = await api('api/wrapper-version', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ node: d.node, version: next }),
  });
  d.project_version = saved.version;
  const snippetInput = $('rowVersion');
  if (snippetInput && snippetInput !== document.activeElement) snippetInput.value = saved.version;
  const rowInput = $(`nextVersion-${d.node}`);
  if (rowInput && rowInput !== document.activeElement) rowInput.value = saved.version;
  return saved;
}

function compiledVersion(d) {
  return (d && (d.project_version || d.own_project_version)) || '';
}

function versionPrefill(d) {
  return compiledVersion(d) || '1.0.0';
}

function syncVersionField(d) {
  const input = $('mVersion');
  input.readOnly = false;
  input.title = T.manualVersionHint;
  input.value = d ? (compiledVersion(d) || '1.0.0') : '1.0.0';
  versionDirty = false;
}

function formChipFamily(d) {
  const published = d && (d.published
    || (devicesCache.find((row) => row.node === d.node) || {}).published);
  if (published && published.chip_family) return published.chip_family;
  if (d && d.chip_family && d.chip_family !== 'ESP32') return d.chip_family;
  return '';
}

function selectedFormDevice() {
  const yaml = $('mYaml').value;
  if (!yaml) return null;
  if (yaml === '__custom__') {
    const node = $('mNode').value;
    return node ? { node, friendly_name: node } : null;
  }
  return configsCache.find((row) => row.node === yaml)
    || devicesCache.find((row) => row.node === yaml)
    || { node: yaml, friendly_name: yaml };
}

function applyDeviceToForm(d) {
  if (!d) return;
  $('mTitle').value = d.friendly_name || '';
  if (!versionDirty) {
    $('mVersion').value = compiledVersion(d) || '1.0.0';
  }
}

function pickAndPublish(d) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.bin';
  input.onchange = () => {
    if (input.files[0]) publishFile(d, input.files[0]);
  };
  input.click();
}

async function publishFile(d, file) {
  if (jobRunning) return;
  if (!file.name.toLowerCase().endsWith('.bin')) {
    alert(T.notBin);
    return;
  }
  if (file.size > 8 * 1024 * 1024) {
    alert(T.fileTooBig);
    return;
  }
  let version = compiledVersion(d);
  if (!version) {
    version = window.prompt(T.versionPrompt, versionPrefill(d)) || '';
    if (!version) return;
  }
  jobRunning = true;
  setJobButtonsDisabled(true);
  const result = $('manualResult');
  if (result) result.innerHTML = `<span class="muted">${T.manualUploading}</span>`;
  try {
    const form = new FormData();
    form.append('node', d.node);
    form.append('version', version);
    form.append('title', d.friendly_name || d.node);
    form.append('chip_family', formChipFamily(d) || '');
    form.append('file', file);
    const body = await api('api/publish/manual', { method: 'POST', body: form });
    if (result) {
      const extra = body.version_overridden ? ` ${T.manualVersionUsed(body.version)}` : '';
      result.innerHTML = `<span class="toast">${T.publishedOk(escapeHtml(d.friendly_name || body.node))}${extra}</span>`;
    }
  } catch (err) {
    if (result) result.innerHTML = `<span style="color:var(--err)">${escapeHtml(err.message)}</span>`;
  } finally {
    finishJob();
  }
}

async function deletePublished(d) {
  if (!confirm(T.deleteConfirm(d.friendly_name))) return;
  await api(`api/publish/${encodeURIComponent(d.node)}`, { method: 'DELETE' });
  loadDevices();
}

async function loadDevices() {
  try {
    const body = await api('api/devices');
    const { devices, configs, dashboard_error, esphome_version } = body;
    if (status && esphome_version) status.esphome_version = esphome_version;
    devicesCache = devices || [];
    configsCache = configs || [];
    $('deviceBanner').innerHTML = dashboard_error
      ? `<div class="card banner warn"><b>${T.dashboardErrorTitle}</b><br>` +
        `<span class="muted tiny">${T.dashboardErrorBody(escapeHtml(dashboard_error))}</span></div>`
      : '';
    fillNodeSelect(configsCache);
    const tbody = $('rows');
    tbody.innerHTML = '';
    if (!devicesCache.length) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="6" class="muted">${T.noDevices}</td></tr>`;
      return;
    }
    devicesCache.forEach((d) => tbody.appendChild(row(d)));
  } catch (err) {
    $('rows').innerHTML = `<tr class="empty-row"><td colspan="6" class="muted">${escapeHtml(err.message)}</td></tr>`;
  }
}

const COPY_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
  '<rect x="9" y="9" width="13" height="13" rx="2"></rect>' +
  '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
const CHECK_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="3" stroke-linecap="round" stroke-linejoin="round">' +
  '<polyline points="20 6 9 17 4 12"></polyline></svg>';

async function copySnippet(id, btn) {
  const text = $(id).textContent;
  let ok = true;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      throw new Error('no async clipboard');
    }
  } catch {
    // Ingress is often plain http on the LAN, which isn't a "secure context" —
    // navigator.clipboard is unavailable there, so fall back to the old
    // select+execCommand trick instead of just failing silently.
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand('copy'); } catch { ok = false; }
    document.body.removeChild(ta);
  }
  const original = btn.innerHTML;
  btn.innerHTML = ok ? `${CHECK_ICON}<span>${T.copied}</span>` : original;
  btn.disabled = true;
  setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 1400);
}
window.copySnippet = copySnippet;

async function showSnippet(d) {
  const body = await api(`api/snippet?node=${encodeURIComponent(d.node)}`);
  const { snippet, legacy, uses_wrapper, version } = body;
  if (version) d.project_version = version;
  const detail = $('detail');
  detail.hidden = false;
  detail.innerHTML = `
    <b>${T.yamlHeader(d.friendly_name)}</b>
    <div class="field" style="margin-top:10px; max-width:220px">
      <label class="tiny muted" for="rowVersion">${T.nextCompileVersion}</label>
      <input type="text" id="rowVersion" value="${escapeHtml(version || d.project_version || '1.0.0')}">
    </div>
    <div class="howto tiny">${T.yamlHowto}</div>
    ${uses_wrapper === false
      ? `<div class="tiny muted" style="margin-top:8px">${T.yamlNoteLegacy}</div>`
      : ''}
    <div class="snippetLabel tiny muted" style="margin-top:10px">
      <span>${T.yamlSnippetLabel}</span>
      <button type="button" class="copyBtn" title="${T.copyTitle}"
              onclick="copySnippet('snippetA', this)">${COPY_ICON}</button>
    </div>
    <pre id="snippetA">${escapeHtml(snippet)}</pre>
    <details style="margin-top:14px">
      <summary class="tiny">${T.legacyTitle}</summary>
      <div class="tiny muted" style="margin-top:6px">${T.legacyBody}</div>
      <div class="snippetLabel tiny muted" style="margin-top:10px">
        <span>${T.legacyUpdateLabel}</span>
        <button type="button" class="copyBtn" title="${T.copyTitle}"
                onclick="copySnippet('snippetLegacyUpdate', this)">${COPY_ICON}</button>
      </div>
      <pre id="snippetLegacyUpdate">${escapeHtml(legacy.update)}</pre>
      <div class="snippetLabel tiny muted" style="margin-top:10px">
        <span>${T.legacyButtonLabel}</span>
        <button type="button" class="copyBtn" title="${T.copyTitle}"
                onclick="copySnippet('snippetLegacyButton', this)">${COPY_ICON}</button>
      </div>
      <pre id="snippetLegacyButton">${escapeHtml(legacy.button)}</pre>
    </details>`;
  const input = $('rowVersion');
  input.title = T.manualVersionHint;
  input.addEventListener('change', async () => {
    const next = input.value.trim();
    if (!next) return;
    try {
      await saveWrapperVersion(d, next);
    } catch (err) {
      $('manualResult').innerHTML = `<span style="color:var(--err)">${escapeHtml(err.message)}</span>`;
    }
  });
  detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

function formatPublishedAt(iso) {
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return iso;
  return date.toLocaleString(LOCALE === 'ko' ? 'ko-KR' : 'en-US', {
    dateStyle: 'short', timeStyle: 'short',
  });
}

function setJobButtonsDisabled(disabled) {
  document.querySelectorAll('.jobctl').forEach((b) => { b.disabled = disabled; });
}

function finishJob() {
  jobRunning = false;
  const submitBtn = $('manualSubmit');
  if (submitBtn) submitBtn.disabled = false;
  loadDevices();
}

async function run(d, compile, clickedBtn) {
  if (jobRunning) return;
  jobRunning = true;
  // Disabled synchronously, before anything async — the click must visibly
  // register even if the POST below takes a moment (queued behind another
  // build, or a slow dashboard connection).
  setJobButtonsDisabled(true);
  const originalLabel = clickedBtn ? clickedBtn.textContent : '';
  if (clickedBtn) clickedBtn.textContent = compile ? T.building : T.publishing;

  const detail = $('detail');
  detail.hidden = false;
  detail.innerHTML = `<b>${d.friendly_name}</b> — ${compile ? T.building : T.publishing}<pre class="log" id="joblog"></pre>`;

  try {
    const job = await api('api/publish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ configuration: d.configuration, compile }),
    });
    clearInterval(polling);
    polling = setInterval(() => pollJob(job.id), 1500);
  } catch (err) {
    jobRunning = false;
    if (clickedBtn) clickedBtn.textContent = originalLabel;
    detail.innerHTML += `\n<div class="tiny" style="color:var(--err)">${escapeHtml(err.message)}</div>`;
    finishJob();
  }
}

async function pollJob(id) {
  const job = await api(`api/jobs/${id}`);
  const log = $('joblog');
  if (log) {
    const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
    log.textContent = job.lines.join('\n') + (job.error ? `\n\n${job.error}` : '');
    if (atBottom) log.scrollTop = log.scrollHeight;
  }
  if (job.status !== 'running') {
    clearInterval(polling);
    polling = null;
    finishJob();
  }
}

$('manualForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  syncNodeField();
  const result = $('manualResult');
  const node = $('mNode').value;
  const version = $('mVersion').value.trim() || '1.0.0';
  if (!node) {
    result.innerHTML = `<span style="color:var(--err)">${escapeHtml(T.manualPickYaml)}</span>`;
    return;
  }
  const submitBtn = $('manualSubmit');
  const originalLabel = submitBtn.textContent;
  submitBtn.disabled = true;
  submitBtn.textContent = T.manualUploading;
  result.textContent = '';
  try {
    const body = await api('api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ node, version, title: $('mTitle').value.trim() }),
    });
    result.innerHTML = `<span style="color:var(--ok)">${T.manualOk(body.node)}</span>`;
    $('mYaml').value = '';
    $('mNode').value = '';
    $('mTitle').value = '';
    $('mVersion').value = '1.0.0';
    syncNodeField();
    await loadDevices();
    const registered = devicesCache.find((row) => row.node === body.node);
    if (registered) showSnippet(registered);
  } catch (err) {
    const msg = /already registered/i.test(err.message) ? T.alreadyRegistered : err.message;
    result.innerHTML = `<span style="color:var(--err)">${escapeHtml(msg)}</span>`;
  } finally {
    submitBtn.textContent = originalLabel;
    submitBtn.disabled = false;
  }
});

$('mYaml').addEventListener('change', () => {
  syncNodeField();
  versionDirty = false;
  if ($('mYaml').value === '__custom__') {
    $('mNode').focus();
    $('mVersion').value = '1.0.0';
    $('mTitle').value = '';
    return;
  }
  if (!$('mYaml').value) {
    $('mVersion').value = '1.0.0';
    $('mTitle').value = '';
    return;
  }
  const d = selectedFormDevice();
  applyDeviceToForm(d);
});

$('mNode').addEventListener('input', () => {});

$('langSelect').value = localStorage.getItem('esphome_ota_lang') || 'auto';
$('langSelect').addEventListener('change', (e) => {
  const value = e.target.value;
  if (value === 'auto') localStorage.removeItem('esphome_ota_lang');
  else localStorage.setItem('esphome_ota_lang', value);
  LOCALE = detectLocale();
  T = STRINGS[LOCALE];
  applyStaticText();
  loadStatus();
  loadDevices();
});

(async () => {
  applyStaticText();
  await loadStatus();
  await loadDevices();
})();
</script>
