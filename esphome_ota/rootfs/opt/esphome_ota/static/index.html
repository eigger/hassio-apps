<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESPHome OTA Server</title>
<style>
  :root {
    --bg: #f6f7f9; --fg: #16191d; --muted: #6b7480; --card: #fff;
    --line: #e2e5ea; --accent: #03a9f4; --ok: #2e7d32; --warn: #b26a00; --err: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --fg:#e6e8eb; --muted:#98a1ac; --card:#1b1f24;
            --line:#2b3138; --accent:#4fc3f7; --ok:#81c784; --warn:#ffb74d; --err:#ef9a9a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--fg);
         font:14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); margin-bottom:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:14px 16px; margin-bottom:14px; }
  .banner { border-left:4px solid var(--warn); }
  .banner.err { border-left-color:var(--err); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line);
           vertical-align:middle; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase;
       letter-spacing:.04em; }
  td.name { font-weight:600; }
  .chip { display:inline-block; padding:1px 7px; border-radius:99px; font-size:12px;
          border:1px solid var(--line); color:var(--muted); }
  .chip.ok { color:var(--ok); border-color:currentColor; }
  .chip.warn { color:var(--warn); border-color:currentColor; }
  button { font:inherit; padding:5px 11px; border-radius:6px; border:1px solid var(--line);
           background:transparent; color:var(--fg); cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#04121a; }
  .actions { display:flex; gap:6px; flex-wrap:wrap; }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:6px;
        padding:10px; overflow-x:auto; font-size:12.5px; margin:8px 0 0; }
  .log { max-height:260px; overflow-y:auto; white-space:pre-wrap; }
  .muted { color:var(--muted); }
  .tiny { font-size:12px; }
  code { background:var(--bg); padding:1px 5px; border-radius:4px; }
  select, input[type=text], input[type=file] {
    font:inherit; padding:5px 8px; border-radius:6px; border:1px solid var(--line);
    background:var(--card); color:var(--fg);
  }
  .topbar { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .formgrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
              gap:10px; align-items:end; margin-top:10px; }
  .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:3px; }
  .field input, .field select { width:100%; }
  details summary { cursor:pointer; font-weight:600; }
  details[open] summary { margin-bottom:4px; }
</style>
</head>
<body>
<div class="topbar">
  <div>
    <h1 id="t-title">ESPHome OTA Server</h1>
    <div class="sub" id="t-sub">Pulls firmware from the ESPHome dashboard and publishes it to /local.</div>
  </div>
  <select id="langSelect" title="Language">
    <option value="auto">Auto</option>
    <option value="en">English</option>
    <option value="ko">한국어</option>
  </select>
</div>

<div id="banners"></div>

<div class="card">
  <table>
    <thead>
      <tr>
        <th id="t-col-device">Device</th>
        <th id="t-col-chip">Chip</th>
        <th id="t-col-version">Published version</th>
        <th id="t-col-status">Status</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="rows"><tr><td colspan="5" class="muted" id="t-loading">Loading…</td></tr></tbody>
  </table>
</div>

<div class="card" id="detail" hidden></div>

<details class="card">
  <summary id="t-manual-title">Manual publish</summary>
  <div class="tiny muted" id="t-manual-body">
    Publish a firmware.ota.bin you downloaded from the ESPHome dashboard yourself.
  </div>
  <form id="manualForm" class="formgrid">
    <div class="field">
      <label id="t-manual-node" for="mNode">Node name</label>
      <input type="text" id="mNode" name="node" pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,62}" required>
    </div>
    <div class="field">
      <label id="t-manual-chip" for="mChip">Chip family</label>
      <select id="mChip" name="chip_family" required></select>
    </div>
    <div class="field">
      <label id="t-manual-version" for="mVersion">Version</label>
      <input type="text" id="mVersion" name="version" required>
    </div>
    <div class="field">
      <label id="t-manual-titlefield" for="mTitle">Title</label>
      <input type="text" id="mTitle" name="title">
    </div>
    <div class="field">
      <label id="t-manual-file" for="mFile">firmware.ota.bin</label>
      <input type="file" id="mFile" name="file" accept=".bin" required>
    </div>
    <div class="field">
      <button type="submit" class="primary jobctl" id="manualSubmit">Publish</button>
    </div>
  </form>
  <div id="manualResult" class="tiny" style="margin-top:8px"></div>
</details>

<script>
const STRINGS = {
  en: {
    title: 'ESPHome OTA Server',
    sub: 'Pulls firmware from the ESPHome dashboard and publishes it to /local.',
    colDevice: 'Device', colChip: 'Chip', colVersion: 'Published version', colStatus: 'Status',
    loading: 'Loading…', noDevices: 'No devices.',
    restartTitle: 'Restart Home Assistant once.',
    restartBody: 'The www folder was just created. Home Assistant registers /local only at ' +
      'startup, so devices can\'t fetch firmware until you restart it once.',
    noDashboardTitle: 'Could not find the ESPHome dashboard.',
    noDashboardBody: 'Make sure the ESPHome Device Builder add-on is running, or set ' +
      '<code>dashboard_url</code> in this add-on\'s options.',
    noBaseUrlTitle: 'Could not determine Home Assistant\'s address.',
    noBaseUrlBody: 'Set <code>base_url</code> in this add-on\'s options, e.g. ' +
      '<code>http://192.168.0.10:8123</code>, so the device packages can be generated.',
    notPublished: 'Not published', needsRepublish: 'Needs republish', published: 'Published',
    noProjectVersion: 'no project.version',
    publish: 'Publish', publishTitleReady: 'Publish the binary already built on the dashboard',
    publishTitleMissing: 'No built binary yet',
    buildPublish: 'Build & publish', yaml: 'YAML',
    yamlHeader: (name) => `${name} — paste into the device YAML`,
    optionA: 'A. Update entity (version comparison, "Install" button in HA)',
    optionB: 'B. Force-install button (no version comparison)',
    pickOne: 'Use one or the other — including both duplicates <code>ota:</code>.',
    building: 'Building…', publishing: 'Publishing…',
    md5: (m) => `md5 ${m}`,
    lanFallbackTitle: 'Using a LAN-only address.',
    lanFallbackBody: 'Home Assistant has no external URL configured (Settings → System → ' +
      'Network), so this add-on fell back to the host\'s LAN address. That only works for ' +
      'devices on the same network — set <code>base_url</code> in the add-on options, or ' +
      'configure HA\'s external URL, for devices outside the LAN.',
    manualTitle: 'Manual publish',
    manualBody: 'Publish a <code>firmware.ota.bin</code> you downloaded from the ESPHome ' +
      'dashboard yourself — no connection to ESPHome needed for this.',
    manualNode: 'Node name (matches ota_device in the YAML)',
    manualChip: 'Chip family', manualVersion: 'Version', manualTitleField: 'Title (optional)',
    manualFile: 'firmware.ota.bin', manualSubmit: 'Publish', manualUploading: 'Uploading…',
    manualOk: (n) => `Published ${n}.`,
  },
  ko: {
    title: 'ESPHome OTA Server',
    sub: 'ESPHome 대시보드에서 펌웨어를 받아 /local로 게시합니다.',
    colDevice: '기기', colChip: '칩', colVersion: '게시된 버전', colStatus: '상태',
    loading: '불러오는 중…', noDevices: '기기가 없습니다.',
    restartTitle: 'Home Assistant를 한 번 재시작하세요.',
    restartBody: 'www 폴더를 방금 만들었습니다. HA는 시작할 때 한 번만 /local 경로를 등록하므로, ' +
      '재시작 전에는 기기가 펌웨어를 받을 수 없습니다.',
    noDashboardTitle: 'ESPHome 대시보드를 찾지 못했습니다.',
    noDashboardBody: 'ESPHome Device Builder 애드온이 실행 중인지 확인하거나, 이 애드온 옵션의 ' +
      '<code>dashboard_url</code>을 직접 지정하세요.',
    noBaseUrlTitle: 'Home Assistant 주소를 알 수 없습니다.',
    noBaseUrlBody: '애드온 옵션의 <code>base_url</code>에 <code>http://192.168.0.10:8123</code> ' +
      '형태로 입력하면 패키지 파일이 생성됩니다.',
    notPublished: '미게시', needsRepublish: '재게시 필요', published: '게시됨',
    noProjectVersion: 'project.version 없음',
    publish: '게시', publishTitleReady: '이미 빌드된 바이너리를 게시',
    publishTitleMissing: '빌드된 바이너리가 없습니다',
    buildPublish: '빌드 후 게시', yaml: 'YAML',
    yamlHeader: (name) => `${name} — 기기 YAML에 붙여넣기`,
    optionA: 'A. 업데이트 엔티티 (버전 비교, HA에 "설치" 버튼)',
    optionB: 'B. 강제 설치 버튼 (버전 비교 없음)',
    pickOne: '둘 중 하나만 쓰세요 — 둘 다 넣으면 <code>ota:</code>가 중복됩니다.',
    building: '빌드 중…', publishing: '게시 중…',
    md5: (m) => `md5 ${m}`,
    lanFallbackTitle: 'LAN 전용 주소를 쓰고 있습니다.',
    lanFallbackBody: 'Home Assistant에 외부 주소가 설정돼 있지 않아서(설정 → 시스템 → 네트워크), ' +
      '호스트의 LAN 주소로 대체했습니다. 같은 네트워크의 기기에만 동작합니다 — LAN 밖 기기라면 ' +
      '애드온 옵션의 <code>base_url</code>을 직접 지정하거나 HA 외부 주소를 설정하세요.',
    manualTitle: '수동 게시',
    manualBody: 'ESPHome 대시보드에서 직접 받은 <code>firmware.ota.bin</code>을 게시합니다 — ' +
      'ESPHome 연결이 필요 없습니다.',
    manualNode: '기기 이름 (YAML의 ota_device와 동일)',
    manualChip: '칩 종류', manualVersion: '버전', manualTitleField: '표시 이름 (선택)',
    manualFile: 'firmware.ota.bin', manualSubmit: '게시', manualUploading: '업로드 중…',
    manualOk: (n) => `${n} 게시 완료.`,
  },
};

function detectLocale() {
  const saved = localStorage.getItem('esphome_ota_lang');
  if (saved === 'en' || saved === 'ko') return saved;
  return (navigator.language || 'en').toLowerCase().startsWith('ko') ? 'ko' : 'en';
}

let LOCALE = detectLocale();
let T = STRINGS[LOCALE];

const $ = (id) => document.getElementById(id);
let status = {};
let polling = null;
let jobRunning = false;

function applyStaticText() {
  document.documentElement.lang = LOCALE;
  $('t-title').textContent = T.title;
  $('t-sub').textContent = T.sub;
  $('t-col-device').textContent = T.colDevice;
  $('t-col-chip').textContent = T.colChip;
  $('t-col-version').textContent = T.colVersion;
  $('t-col-status').textContent = T.colStatus;
  $('t-loading').textContent = T.loading;
  $('t-manual-title').textContent = T.manualTitle;
  $('t-manual-body').innerHTML = T.manualBody;
  $('t-manual-node').textContent = T.manualNode;
  $('t-manual-chip').textContent = T.manualChip;
  $('t-manual-version').textContent = T.manualVersion;
  $('t-manual-titlefield').textContent = T.manualTitleField;
  $('t-manual-file').textContent = T.manualFile;
  $('manualSubmit').textContent = T.manualSubmit;
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}

function banner(title, body, kind) {
  const div = document.createElement('div');
  div.className = 'card banner' + (kind === 'err' ? ' err' : '');
  div.innerHTML = `<b>${title}</b><br><span class="muted tiny">${body}</span>`;
  $('banners').appendChild(div);
}

async function loadStatus() {
  status = await api('api/status');
  $('banners').innerHTML = '';
  if (status.restart_required) banner(T.restartTitle, T.restartBody, 'warn');
  if (!status.dashboard) banner(T.noDashboardTitle, T.noDashboardBody, 'err');
  if (!status.base_url) banner(T.noBaseUrlTitle, T.noBaseUrlBody, 'err');
  else if (status.base_url_source === 'lan_ip_fallback') banner(T.lanFallbackTitle, T.lanFallbackBody, 'warn');

  const chipSelect = $('mChip');
  const previous = chipSelect.value;
  chipSelect.innerHTML = (status.chip_families || [])
    .map((c) => `<option value="${c}">${c}</option>`).join('');
  if (previous) chipSelect.value = previous;
}

function row(d) {
  const tr = document.createElement('tr');
  const pub = d.published;
  const stale = pub && d.project_version && pub.version !== d.project_version;

  const state = !pub
    ? `<span class="chip">${T.notPublished}</span>`
    : stale
      ? `<span class="chip warn">${T.needsRepublish}</span>`
      : `<span class="chip ok">${T.published}</span>`;

  const version = pub
    ? `${pub.version}<div class="tiny muted">${T.md5(pub.md5.slice(0, 8))}</div>`
    : '<span class="muted">—</span>';

  tr.innerHTML = `
    <td class="name">${d.friendly_name}<div class="tiny muted">${d.configuration}</div></td>
    <td>${d.chip_family || '<span class="muted">?</span>'}</td>
    <td>${version}</td>
    <td>${state}${d.project_version ? '' : `<div class="tiny muted">${T.noProjectVersion}</div>`}</td>
    <td class="actions"></td>`;

  const actions = tr.querySelector('.actions');
  const publishBtn = document.createElement('button');
  publishBtn.className = 'jobctl';
  publishBtn.textContent = T.publish;
  publishBtn.disabled = jobRunning || !d.has_binary;
  publishBtn.title = d.has_binary ? T.publishTitleReady : T.publishTitleMissing;
  publishBtn.onclick = () => run(d, false, publishBtn);

  const buildBtn = document.createElement('button');
  buildBtn.className = 'jobctl primary';
  buildBtn.textContent = T.buildPublish;
  buildBtn.disabled = jobRunning;
  buildBtn.onclick = () => run(d, true, buildBtn);

  const yamlBtn = document.createElement('button');
  yamlBtn.textContent = T.yaml;
  yamlBtn.onclick = () => showSnippet(d);

  actions.append(publishBtn, buildBtn, yamlBtn);
  return tr;
}

async function loadDevices() {
  try {
    const { devices } = await api('api/devices');
    const tbody = $('rows');
    tbody.innerHTML = '';
    if (!devices.length) {
      tbody.innerHTML = `<tr><td colspan="5" class="muted">${T.noDevices}</td></tr>`;
      return;
    }
    devices.forEach((d) => tbody.appendChild(row(d)));
  } catch (err) {
    $('rows').innerHTML = `<tr><td colspan="5" class="muted">${escapeHtml(err.message)}</td></tr>`;
  }
}

async function showSnippet(d) {
  const [update, button] = await Promise.all([
    api(`api/snippet?node=${encodeURIComponent(d.node)}&mode=update`),
    api(`api/snippet?node=${encodeURIComponent(d.node)}&mode=button`),
  ]);
  const detail = $('detail');
  detail.hidden = false;
  detail.innerHTML = `
    <b>${T.yamlHeader(d.friendly_name)}</b>
    <div class="tiny muted" style="margin-top:10px">${T.optionA}</div>
    <pre>${escapeHtml(update.snippet)}</pre>
    <div class="tiny muted" style="margin-top:12px">${T.optionB}</div>
    <pre>${escapeHtml(button.snippet)}</pre>
    <div class="tiny muted" style="margin-top:10px">${T.pickOne}</div>`;
  detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

function setJobButtonsDisabled(disabled) {
  document.querySelectorAll('.jobctl').forEach((b) => { b.disabled = disabled; });
}

async function run(d, compile, clickedBtn) {
  if (jobRunning) return;
  jobRunning = true;
  // Disabled synchronously, before anything async — the click must visibly
  // register even if the POST below takes a moment (queued behind another
  // build, or a slow dashboard connection).
  setJobButtonsDisabled(true);
  const originalLabel = clickedBtn ? clickedBtn.textContent : '';
  if (clickedBtn) clickedBtn.textContent = compile ? T.building : T.publishing;

  const detail = $('detail');
  detail.hidden = false;
  detail.innerHTML = `<b>${d.friendly_name}</b> — ${compile ? T.building : T.publishing}<pre class="log" id="joblog"></pre>`;

  try {
    const job = await api('api/publish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ configuration: d.configuration, compile }),
    });
    clearInterval(polling);
    polling = setInterval(() => pollJob(job.id), 1500);
  } catch (err) {
    jobRunning = false;
    if (clickedBtn) clickedBtn.textContent = originalLabel;
    detail.innerHTML += `\n<div class="tiny" style="color:var(--err)">${escapeHtml(err.message)}</div>`;
    loadDevices();
  }
}

async function pollJob(id) {
  const job = await api(`api/jobs/${id}`);
  const log = $('joblog');
  if (log) {
    const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
    log.textContent = job.lines.join('\n') + (job.error ? `\n\n${job.error}` : '');
    if (atBottom) log.scrollTop = log.scrollHeight;
  }
  if (job.status !== 'running') {
    clearInterval(polling);
    polling = null;
    jobRunning = false;
    loadDevices();
  }
}

$('manualForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (jobRunning) return;
  jobRunning = true;
  setJobButtonsDisabled(true);
  const submitBtn = $('manualSubmit');
  const originalLabel = submitBtn.textContent;
  submitBtn.textContent = T.manualUploading;
  const result = $('manualResult');
  result.textContent = '';

  try {
    const form = new FormData(e.target);
    const body = await api('api/publish/manual', { method: 'POST', body: form });
    result.innerHTML = `<span style="color:var(--ok)">${T.manualOk(body.node)}</span>`;
    e.target.reset();
  } catch (err) {
    result.innerHTML = `<span style="color:var(--err)">${escapeHtml(err.message)}</span>`;
  } finally {
    jobRunning = false;
    submitBtn.textContent = originalLabel;
    submitBtn.disabled = false;
    // Table buttons' disabled state depends on per-device data (has_binary),
    // not just jobRunning — a blind re-enable here would un-disable a
    // Publish button for a device with no built binary. Reload instead.
    loadDevices();
  }
});

$('langSelect').value = localStorage.getItem('esphome_ota_lang') || 'auto';
$('langSelect').addEventListener('change', (e) => {
  const value = e.target.value;
  if (value === 'auto') localStorage.removeItem('esphome_ota_lang');
  else localStorage.setItem('esphome_ota_lang', value);
  LOCALE = detectLocale();
  T = STRINGS[LOCALE];
  applyStaticText();
  loadStatus();
  loadDevices();
});

(async () => {
  applyStaticText();
  await loadStatus();
  await loadDevices();
})();
</script>
</body>
</html>
