---
name: Garage
version: "1.3.7"
slug: garage
description: Self-hosted car management — maintenance, fuel, OBD/GPS (all-in-one)
url: https://github.com/eigger/hassio-apps/tree/master/garage
# Upstream publishes ghcr.io/eigger/garage-{api,web} for linux/amd64 only, and this
# app copies those images straight in — so aarch64 cannot be offered until upstream
# starts building it.
arch:
  - amd64
init: false
# Upstream 1.3.7 lets the web app run under a path prefix decided at start-up, so the
# UI can be served through Ingress — that is the only way in from Home Assistant's own
# external URL. The host port stays published for direct LAN access.
ingress: true
ingress_port: 3080
webui: http://[HOST]:[PORT:3080]/
panel_icon: mdi:car
panel_title: Garage
ports:
  3080/tcp: 3081
ports_description:
  3080/tcp: Garage UI (nginx → web + /api); default host port 3081
map:
  - addon_config:rw
# No options or schema on purpose: Garage manages every integration key itself, in
# its /integrations screen. The API reads them through getSetting(), which prefers
# the value stored in its own database and only falls back to the environment — so
# an option here would be silently ignored the moment someone saves in the UI.
