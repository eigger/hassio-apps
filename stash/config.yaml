  3080/tcp: Direct UI access (optional; Ingress preferred)
map:
  - addon_config:rw
options:
  log_level: info
  jwt_secret: ""
  app_public_url: ""
  upcitemdb_api_key: ""
  inventory_webhook_url: ""
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  jwt_secret: password
  app_public_url: str?
  upcitemdb_api_key: password?
  inventory_webhook_url: url?
