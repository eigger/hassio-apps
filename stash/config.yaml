---
name: Stash
version: "0.7.5"
slug: stash
description: Self-hosted home inventory & barcode manager (all-in-one)
url: https://github.com/eigger/hassio-apps/tree/master/stash
# Upstream publishes ghcr.io/eigger/stash-{api,web} for linux/amd64 only, and this
# app copies those images straight in — so aarch64 cannot be offered until upstream
# starts building it.
arch:
  - amd64
init: false
# Upstream 0.7.5 lets the web app run under a path prefix decided at start-up, so the
# UI can be served through Ingress — that is the only way in from Home Assistant's own
# external URL. The host port stays published for direct LAN access.
ingress: true
ingress_port: 3080
panel_icon: mdi:package-variant-closed
panel_title: Stash
ports:
  3080/tcp: 3080
ports_description:
  3080/tcp: Stash UI (nginx → web + /api); default host port 3080
map:
  - addon_config:rw
